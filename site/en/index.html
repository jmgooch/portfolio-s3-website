<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaime Gooch Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 font-sans antialiased transition-colors duration-300">
    
    <nav class="fixed w-full bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm shadow-sm z-50 transition-colors duration-300">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#home" class="font-bold text-xl tracking-tight">Jaime Gooch's Portfolio</a>
            <div class="flex items-center space-x-4 md:space-x-6">
                <a id="nav-about" href="#about" class="hidden md:inline hover:text-blue-600 dark:hover:text-blue-400 transition"></a>
                <a id="nav-experience" href="#experience" class="hidden md:inline hover:text-blue-600 dark:hover:text-blue-400 transition"></a>
                <a id="nav-projects" href="#projects" class="hidden md:inline hover:text-blue-600 dark:hover:text-blue-400 transition"></a>
                <a id="nav-contact" href="#contact" class="hidden md:inline hover:text-blue-600 dark:hover:text-blue-400 transition"></a>
                
                <a id="lang-toggle" href="#" class="text-sm font-semibold border px-2 py-1 rounded hover:bg-gray-200 dark:border-gray-600 dark:hover:bg-gray-700 transition" onclick="localStorage.setItem('lang_selected', 'true')"></a>
                
                <button id="theme-toggle" class="p-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700 transition" aria-label="Toggle Dark Mode">
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        </div>
    </nav>

    <section id="home" class="relative min-h-screen flex items-center justify-center pt-16 bg-[url('../background.jpg')] bg-cover bg-center bg-no-repeat transition-colors duration-300">
        
        <div class="absolute inset-0 bg-white/60 dark:bg-gray-900/60 backdrop-blur-sm transition-colors duration-300"></div>
        
        <div class="relative z-10 text-center px-4">
            <img id="hero-image" src="" alt="Profile" class="w-48 h-48 rounded-full object-cover mx-auto mb-6 shadow-lg border-4 border-white dark:border-gray-800 hidden">
            <h1 id="hero-title" class="text-5xl font-bold mb-4"></h1>
            <p id="hero-tagline" class="text-xl text-gray-800 dark:text-gray-200 font-medium"></p>
        </div>
    </section>

    <section id="about" class="py-20 bg-white dark:bg-gray-800 transition-colors duration-300">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h2 id="about-title" class="text-3xl font-bold mb-8"></h2>
            <p id="about-text" class="text-lg text-gray-700 dark:text-gray-300 leading-relaxed max-w-2xl mx-auto"></p>
        </div>
    </section>

    <section id="experience" class="py-20 bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
        <div class="max-w-4xl mx-auto px-4">
            <h2 id="experience-title" class="text-3xl font-bold mb-12 text-center"></h2>
            <div id="experience-container" class="space-y-8"></div>
        </div>
    </section>

    <section id="projects" class="py-20 bg-white dark:bg-gray-800 transition-colors duration-300">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <h2 id="projects-title" class="text-3xl font-bold mb-12"></h2>
            <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 text-left"></div>
        </div>
    </section>

    <section id="contact" class="py-24 bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <h2 id="contact-title" class="text-3xl font-bold mb-6"></h2>
            <p id="contact-desc" class="text-lg text-gray-700 dark:text-gray-300 mb-10 max-w-xl mx-auto"></p>
            
            <div class="flex justify-center space-x-4">
                <a id="contact-linkedin" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-sm">
                    <i class="fab fa-linkedin mr-2 text-xl"></i> LinkedIn
                </a>
                <a id="contact-github" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center px-6 py-3 bg-gray-800 dark:bg-gray-700 text-white rounded-lg hover:bg-gray-900 dark:hover:bg-gray-600 transition shadow-sm">
                    <i class="fab fa-github mr-2 text-xl"></i> GitHub
                </a>
                <a id="contact-email" href="#" class="flex items-center px-6 py-3 bg-white dark:bg-gray-800 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition shadow-sm">
                    <i class="fas fa-envelope mr-2 text-xl"></i> Email
                </a>
            </div>
        </div>
    </section>

    <footer class="bg-white dark:bg-gray-800 py-6 text-center text-gray-500 dark:text-gray-400 text-sm border-t border-gray-200 dark:border-gray-700 transition-colors duration-300">
        <p>&copy; <span id="current-year"></span> Portfolio. All rights reserved.</p>
    </footer>

    <script>
        // --- Configuration ---
        // Change this to 'jp' when you copy this file to the /jp/ folder
        const CURRENT_LANG = 'en'; 

        // --- Theme Logic ---
        var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        if (document.documentElement.classList.contains('dark')) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }
        document.getElementById('theme-toggle').addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });

        document.getElementById('current-year').textContent = new Date().getFullYear();

        // --- Data Fetching Logic ---
        async function loadPortfolioData() {
            try {
                // Fetch from the root directory
                const response = await fetch('../data.json');
                const fullData = await response.json();
                
                // Isolate the language we care about
                const data = fullData[CURRENT_LANG];

                // Populate UI & Nav
                document.getElementById('nav-about').textContent = data.ui.nav_about;
                document.getElementById('nav-experience').textContent = data.ui.nav_experience;
                document.getElementById('nav-projects').textContent = data.ui.nav_projects;
                document.getElementById('nav-contact').textContent = data.ui.nav_contact;
                
                const langBtn = document.getElementById('lang-toggle');
                langBtn.textContent = data.ui.lang_toggle_text;
                langBtn.href = data.ui.lang_toggle_link;

                // Populate Hero
                document.getElementById('hero-title').textContent = data.hero.title;
                document.getElementById('hero-tagline').textContent = data.hero.tagline;
                const heroImg = document.getElementById('hero-image');
                heroImg.src = data.hero.image;
                heroImg.classList.remove('hidden');

                // Populate About
                document.getElementById('about-title').textContent = data.about.title;
                document.getElementById('about-text').textContent = data.about.content;

                // Populate Experience
                document.getElementById('experience-title').textContent = data.experience.title;
                const experienceContainer = document.getElementById('experience-container');
                data.experience.jobs.forEach(job => {
                    const bullets = job.highlights.map(h => `<li>${h}</li>`).join('');
                    
                    // Check if a URL exists. If yes, make it a link. If no, make it plain text.
                    const companyElement = job.url 
                        ? `<a href="${job.url}" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">${job.company}</a>`
                        : `<span class="text-blue-600 dark:text-blue-400 font-semibold">${job.company}</span>`;

                    const jobHTML = `
                        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm border border-gray-100 dark:border-gray-700">
                            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-2">
                                <h3 class="text-xl font-bold">${job.role}</h3>
                                ${companyElement}
                            </div>
                            <p class="text-sm text-gray-500 dark:text-gray-400 mb-4">${job.date}</p>
                            <ul class="list-disc list-inside text-gray-700 dark:text-gray-300 space-y-2">
                                ${bullets}
                            </ul>
                        </div>
                    `;
                    experienceContainer.innerHTML += jobHTML;
                });

                // Populate Projects
                document.getElementById('projects-title').textContent = data.projects.title;
                const projectsContainer = document.getElementById('projects-container');
                data.projects.list.forEach(project => {
                    const projectHTML = `
                        <div class="bg-gray-50 dark:bg-gray-900 p-6 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 hover:shadow-md transition-shadow">
                            <h3 class="text-xl font-bold mb-2">${project.name}</h3>
                            <p class="text-gray-600 dark:text-gray-400 text-sm mb-4">${project.description}</p>
                            <a href="${project.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-blue-600 dark:text-blue-400 hover:underline font-medium">
                                ${data.ui.view_project} <i class="fas fa-arrow-right ml-2 text-sm"></i>
                            </a>
                        </div>
                    `;
                    projectsContainer.innerHTML += projectHTML;
                });

                // Populate Contact
                document.getElementById('contact-title').textContent = data.contact.title;
                document.getElementById('contact-desc').textContent = data.contact.description;
                document.getElementById('contact-linkedin').href = data.contact.linkedin;
                document.getElementById('contact-github').href = data.contact.github;
                document.getElementById('contact-email').href = `mailto:${data.contact.email}`;

            } catch (error) {
                console.error("Error loading portfolio data:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadPortfolioData);
    </script>
</body>
</html>
